<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Clear</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background: #2d5a57; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
        .result-card { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); width: 400px; }
        .sun-icon { font-size: 5rem; margin-bottom: 20px; }
        .prob-text { font-size: 3rem; font-weight: bold; color: #ffeb3b; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="result-card">
        <div class="sun-icon">☀️</div>
        <h2>Weather Clear</h2>
        <div class="prob-text">{{ prob }}%</div>
        <p>It is safe to continue regular farming activities.</p>
        <br>
        <a href="/" style="color: #ffeb3b; text-decoration: none;"> Back to Dashboard</a>
    </div>
</body>
</html>
